<html lang="fr">

<body>
<header>

        <a href="../html/itineraire.html" class="logo-link">
            <img

                    class="logo-img"

            <img
                    src="../image/logo-texte.png"
                    alt="AuptiMétro"
                    class="logo-txt"

        <object
                id="graph_complet"
                class="graph_svg"
                data="../svg/graph.svg"

        <object
                id="graph_geo"

    <section class="graph_section">
        <h2>ACPM</h2>
        <object
                id="acpm"
                class="graph_svg"
                data="../svg/ACPM.svg"
                type="image/svg+xml"
        ></object>

    <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
