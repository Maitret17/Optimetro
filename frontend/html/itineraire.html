<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Itinéraire</title>

    <link rel="stylesheet" type="text/css" href="../css/style.css" />

    <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
</head>

<body>
<header>
    <div id="titre">
        <a href="../html/itineraire.html" class="logo-link">
            <img
                    src="../image/logo-img.png"
                    alt="Logo AuptiMétro"
                    class="logo-img"
            />
            <img
                    src="../image/logo-texte.png"
                    alt="AuptiMétro"
                    class="logo-txt"
            />
        </a>
    </div>

    <nav class="bandeau">
        <a href="../html/itineraire.html">Itinéraire</a>
        <a href="../html/alerte.html">Alerte réseau</a>
        <a href="../html/graph.html">Graphe</a>
    </nav>
</header>

<main class="main_itineraire">
    <div class="side_by_side">
        <section id="recherche_itineraire">
            <form id="route-form" action="#" method="get">
                <h2>Rechercher un trajet</h2>

                <div class="trajet-box">
                    <div class="trajet-row">
                        <span class="point depart"></span>
                        <input
                                id="depart-input"
                                list="station-list"
                                type="text"
                                name="depart"
                                placeholder="Départ — Porte de Versailles [12]"
                        />
                    </div>

                    <div class="trajet-row">
                        <span class="point arrivee"></span>
                        <input
                                id="arrivee-input"
                                list="station-list"
                                type="text"
                                name="arrivee"
                                placeholder="Arrivée — Villejuif - Louis Aragon [7]"
                        />

                        <button
                                type="button"
                                class="swap"
                                aria-label="Inverser départ et arrivée"
                        >
                            ↕
                        </button>
                    </div>
                </div>

                <datalist id="station-list"></datalist>

                <div class="trajet_mode">
                    <button type="button" class="transport cost-option active" data-cost-type="TIME">
                        ⏱ Temps
                    </button>

                    <button type="button" class="transport cost-option" data-cost-type="CARBON">
                        🌱 Moins polluant
                    </button>
                </div>

                <button type="submit" class="trajet_submit">
                    Calculer le trajet optimal
                </button>
            </form>

            <div class="trajet_result">
                <p class="nbr_itineraire">
                    Itinéraire trouvé : <span id="nb_itineraires">1</span>
                </p>

                <div class="liste_itineraire" id="route-results">
                    <article class="itineraire" data-type="optimal">
                        <div class="itineraire_header">
                            <span class="badge">Optimal</span>
                            <span class="co2">0.4 g</span>
                        </div>

                        <h3 class="duree">18 min</h3>

                        <p class="details">3 stations - 1 changement - L7 → L1</p>
                    </article>
                </div>
            </div>
        </section>

        <section class="map-container">
            <div id="map"></div>

            <div class="fenetre-flottante">
                <div class="fenetre-header">
                    <h2>Détail du trajet</h2>
                    
                </div>

                <div id="timeline_trajet" class="timeline_trajet"></div>
            </div>
        </section>
    </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../script/script.js"></script>

<footer>
    <p>©2026 | Projet Métro-EFREI-Dodo | Mastercamp IT4 groupe B</p>
</footer>
</body>
</html>
