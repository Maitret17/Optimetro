<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alerte AuptiMetro</title>
    <link rel="stylesheet" type="text/css" href="../css/style.css" />
  </head>
  <body>
    <header>
      <div id="titre">
        <a href="../html/itineraire.html" class="logo-link"
          ><img
            src="../image/logo-img.png"
            alt="Logo AuptiMétro"
            class="logo-img" /><img
            src="../image/logo-texte.png"
            alt="AuptiMétro"
            class="logo-txt"
        /></a>
      </div>
      <nav class="bandeau">
        <a href="../html/itineraire.html">Itinéraire</a>
        <a href="../html/alerte.html">Alerte réseau</a>
        <a href="../html/graph.html">Graphe</a>
      </nav>
    </header>

    <main class="main_alerte">
      <h2>Alerte trafic — réseau Île-de-France Mobilités</h2>

      <!-- Filtres par mode de transport -->
      <div class="alerte_filtres" id="alerte_filtres">
        <button type="button" class="transport active" data-mode="tous">
          Tous
        </button>
        <button type="button" class="transport" data-mode="metro">Métro</button>
        <button type="button" class="transport" data-mode="rer">RER</button>
        <button type="button" class="transport" data-mode="tram">
          Tramway
        </button>
        <button
          type="button"
          class="trajet_submit alerte_refresh"
          id="refresh_btn"
        >
          Actualiser
        </button>
      </div>

      <p id="alerte_statut" class="alerte_statut"></p>

      <div id="alert_ratp"></div>
    </main>

    <script src="../script/alert.js"></script>

    <footer>
      <p>©2026 | Projet Métro-EFREI-Dodo | Mastercamp IT4 groupe B</p>
    </footer>
  </body>
</html>
